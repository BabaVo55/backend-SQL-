version: '3'
services:
  app:
    build: .
    container_name: todo-app
    environment:
      - DATABASE_URL= DATABASE_URL=postgresql://postgres:postgres@db:5432/todoapp
      - KWT_SECRET=your_jwt_secret_here
      - NODE_ENV=development
      - PORT=8081
    ports:
    #   ext-internal
      - "8081:8081"
    depends_on:
      - db
    # a save file
    volumes:
      - .:/app


  db:
    image: postgres:13-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todoapp
    ports:
      - "5432:5432"
    volumes:  
      - postgres-data:/var/lib/postgressql/data

volumes:
  postgres-data